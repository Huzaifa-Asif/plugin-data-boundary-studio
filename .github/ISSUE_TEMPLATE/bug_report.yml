name: Bug report
description: Report a reproducible defect without including private data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, real personal records, or production data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
